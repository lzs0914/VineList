<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>vine</title>
<link rel="stylesheet" href="vine.css">
</head>
<body>
<div id="stage">
  <svg id="vine"></svg>
  <div id="zone"></div>
  <div id="layer"></div>
  <div id="count"><b>0</b><i>件待处理</i></div>
  <div id="composer">
    <div class="c-head"><span class="c-dot"></span>便签<span class="c-esc">Esc 保存</span></div>
    <textarea id="note" spellcheck="false" placeholder="随手记一句，想起来就摘下来…"></textarea>
    <div class="c-foot"><button id="save">挂到藤上</button></div>
  </div>
  <div id="hint">Ctrl+Shift+A 截图　·　Ctrl+Shift+N 便签　·　Ctrl+Shift+Q 收起</div>
  <div id="toast"></div>
</div>
<script src="vine.js"></script>
</body>
</html>
